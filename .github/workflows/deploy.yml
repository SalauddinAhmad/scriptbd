name: 🚀 Auto Deploy to scriptbd.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy via Webhook
        run: |
          echo "🚀 Triggering deploy on scriptbd.com..."
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET \
            "https://scriptbd.com/deploy.php" \
            -H "User-Agent: GitHub-Actions-Deploy")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Deploy returned HTTP $HTTP_CODE"
            exit 1
          fi
          
          # Check if JSON response has ok:true
          OK=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',False))" 2>/dev/null || echo "False")
          if [ "$OK" != "True" ]; then
            echo "::error::Deploy failed - check response above"
            exit 1
          fi
          
          echo "✅ Deploy successful!"
