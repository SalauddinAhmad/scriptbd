name: 🚀 Deploy to scriptbd.com

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          echo "=== dist contents ==="
          ls -la dist/

      - name: Create Deploy Package
        run: |
          mkdir -p deploy-pkg
          cp -r frontend/dist/* deploy-pkg/
          cp -r backend deploy-pkg/
          cp index.html deploy-pkg/ 2>/dev/null || true
          echo "=== Package contents ==="
          find deploy-pkg -type f | head -30
          tar -czf deploy.tar.gz -C deploy-pkg .

      - name: Deploy via Webhook
        run: |
          echo "Uploading to server..."
          curl -v -F "package=@deploy.tar.gz" \
            "https://scriptbd.com/deploy.php?secret=script…cure"
