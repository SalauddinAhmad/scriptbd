name: 🚀 Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy
        run: |
          RESP=$(curl -sS "https://scriptbd.com/_deploy.php?secret=sbd2026deploy" -H "User-Agent: GitHub-Actions")
          echo "Server Output: $RESP"
          echo "$RESP" | python3 -c "import sys,json;d=json.load(sys.stdin);print('\n'.join(d.get('log',[])));exit(0 if d.get('ok') else 1)" && echo "✅ LIVE!" || (echo "❌ FAIL"; exit 1)
